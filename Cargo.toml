[package]
# Fixed so the manifest's `entry` path stays valid in every plugin made from this template.
name = "haunt-plugin"
description = "Suggests exact Claude Code allow rules after 3 identical approvals in Haunt."
edition = "2024"
license = "MIT"
version = "0.1.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.63", default-features = false, features = ["macros", "realloc"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

[workspace]
